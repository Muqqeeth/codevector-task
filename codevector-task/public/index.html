<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #333; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    select, button { padding: 10px 20px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
    button { background: #4f46e5; color: white; border: none; }
    button:hover { background: #4338ca; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card h3 { font-size: 15px; margin-bottom: 8px; color: #111; }
    .card .category { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
    .card .price { font-size: 18px; font-weight: bold; color: #4f46e5; }
    .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
    .loading { text-align: center; font-size: 18px; margin-top: 40px; color: #555; }
    .error { text-align: center; color: red; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Product Browser</h1>

  <div class="controls">
    <select id="categorySelect">
      <option value="">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Books">Books</option>
      <option value="Home">Home</option>
      <option value="Sports">Sports</option>
      <option value="Food">Food</option>
      <option value="Toys">Toys</option>
    </select>
    <button onclick="resetAndFetch()">Filter</button>
  </div>

  <div id="loading" class="loading" style="display:none">Loading...</div>
  <div id="error" class="error" style="display:none"></div>
  <div id="grid" class="grid"></div>

  <div class="pagination">
    <button id="prevBtn" onclick="goBack()" disabled>Previous</button>
    <button id="nextBtn" onclick="goNext()" disabled>Next</button>
  </div>

  <script>
    let cursorHistory = [];
    let currentCursor = null;
    let hasMore = false;

    async function fetchProducts(cursor) {
      const category = document.getElementById('categorySelect').value;
      const loading = document.getElementById('loading');
      const errorDiv = document.getElementById('error');
      const grid = document.getElementById('grid');

      loading.style.display = 'block';
      grid.innerHTML = '';
      errorDiv.style.display = 'none';

      let url = '/api/products';
      const params = [];
      if (category) params.push('category=' + category);
      if (cursor) params.push('cursor=' + cursor);
      if (params.length > 0) url += '?' + params.join('&');

      try {
        const res = await fetch(url);
        const data = await res.json();

        loading.style.display = 'none';
        hasMore = data.hasMore;
        currentCursor = data.nextCursor;

        data.data.forEach(function(product) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML =
            '<h3>' + product.name + '</h3>' +
            '<div class="category">' + product.category + '</div>' +
            '<div class="price">₹' + parseFloat(product.price).toFixed(2) + '</div>';
          grid.appendChild(card);
        });

        document.getElementById('nextBtn').disabled = !hasMore;
        document.getElementById('prevBtn').disabled = cursorHistory.length === 0;

      } catch (err) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Something went wrong. Please try again.';
      }
    }

    function resetAndFetch() {
      cursorHistory = [];
      currentCursor = null;
      fetchProducts(null);
    }

    function goNext() {
      cursorHistory.push(currentCursor);
      fetchProducts(currentCursor);
    }

    function goBack() {
      cursorHistory.pop();
      const prevCursor = cursorHistory.length > 0 ? cursorHistory[cursorHistory.length - 1] : null;
      fetchProducts(prevCursor);
    }

    fetchProducts(null);
  </script>

</body>
</html>
